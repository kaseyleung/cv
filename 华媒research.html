		<div class="research-copy">
			<p class="research-eyebrow"><span></span> HUAMEI / CAMPUS DAILY / 2024</p>

		</div>
		<div class="research-controls" role="group" aria-label="选择校园报道视角">
			<button type="button" data-focus="all" aria-pressed="true">全景</button>
			<button type="button" data-focus="interview" aria-pressed="false">采访</button>
			<button type="button" data-focus="shooting" aria-pressed="false">报纸拍摄</button>

		<p class="research-hint"><span>DRAG</span> 旋转校园 <i></i> <span>SCROLL</span> 调整距离</p>
